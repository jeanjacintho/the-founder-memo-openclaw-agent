<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<title>{{MASTHEAD}} · {{DATE}}</title>
<style>
  /* One Letter page, printed at night and read in the morning. The renderer
     fills every {{SLOT}}; nothing here runs, and nothing is fetched. */
  @page { size: Letter; margin: 14mm 16mm 14mm; }
  body {
    margin: 0; color: #111; background: #fff;
    font-family: Georgia, "Times New Roman", "Liberation Serif", serif;
    font-size: 10pt; line-height: 1.3;
  }
  header { border-bottom: 2px solid #111; padding-bottom: 4px; margin-bottom: 10px; }
  .masthead { margin: 0; font-size: 22pt; letter-spacing: 0.02em; }
  .dateline { margin: 2px 0 0; font-size: 9pt; text-transform: uppercase; letter-spacing: 0.08em; }
  .band { margin: 0 0 8px; font-size: 9pt; text-transform: uppercase; letter-spacing: 0.1em; color: #444; }
  .priority { break-inside: avoid; border-top: 1px solid #999; padding: 8px 0 6px; position: relative; }
  .priority .rank { position: absolute; left: 0; top: 6px; margin: 0; font-size: 20pt; font-weight: bold; }
  .priority h2 { margin: 0 0 4px 30px; font-size: 13pt; line-height: 1.2; }
  .priority p, .priority ul, .priority blockquote { margin-left: 30px; }
  .priority p { margin-top: 0; margin-bottom: 4px; }
  .evidence { margin: 2px 0 4px; padding-left: 14px; font-size: 9pt; }
  .src { color: #444; font-size: 8.5pt; }
  .src a, .evidence a { color: inherit; text-decoration: none; }
  .first-step { font-size: 10pt; }
  blockquote { margin-top: 4px; margin-bottom: 0; font-style: italic; font-size: 9.5pt; }
  .questions, .unavailable { break-inside: avoid; border-top: 2px solid #111; margin-top: 8px; padding-top: 6px; }
  .questions h3, .unavailable h3 { margin: 0 0 4px; font-size: 9pt; letter-spacing: 0.08em; }
  .questions ul, .unavailable ul { margin: 0; padding-left: 16px; }
  footer { margin-top: 10px; border-top: 1px solid #999; padding-top: 4px; font-size: 8.5pt; color: #444; }
</style>
</head>
<body>
<header>
  <h1 class="masthead">{{MASTHEAD}}</h1>
  <p class="dateline">{{DATE}}</p>
</header>
<p class="band">{{BAND}}</p>
{{BODY}}
<footer>{{COST}}</footer>
</body>
</html>
